# .github/workflows/build.yml
name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # Trigger build when a version tag is pushed (e.g., v1.0.0)
  workflow_dispatch: # Allow manual triggering with custom inputs
    inputs:
      release_notes:
        description: 'Enter the release description/change log'
        required: false
        default: |
          - Thread-safe UTC logging.
          - System tray support.
          - Dynamic status updates.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        # Checkout the source code
        uses: actions/checkout@v4

      - name: Set up Python
        # Initialize Python environment based on README specs
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        # Install libraries required for GUI, Tray, and Building
        run: |
          python -m pip install --upgrade pip
          pip install keyboard Pillow pystray nuitka

      - name: Build EXE with Nuitka
        # Build standalone executable as defined in README section 5
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-icon-from-ico=icon.ico `
            --windows-disable-console `
            GUI.py

      - name: Upload Artifact
        # Store the EXE as an artifact for 90 days
        uses: actions/upload-artifact@v4
        with:
          name: QQ_Quick_Update_Tool
          path: GUI.exe

      - name: Create Release
        # Generate formal GitHub Release with user-defined descriptions
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          tag_name: ${{ github.ref_name || 'manual-build' }}
          body: |
            ## Release Notes
            ${{ github.event.inputs.release_notes || 'Automated build from tag push.' }}
            
            ---
            *Built automatically via GitHub Actions.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}