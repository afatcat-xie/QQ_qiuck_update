name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签触发（如 v1.0.0）
  workflow_dispatch: # 支持从 GitHub 页面手动点击触发
    inputs:
      release_notes:
        description: 'Release Notes / 发布说明'
        required: false
        default: |
          - Thread-safe UTC logging.
          - System tray support.
          - Dynamic status updates.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 必须有 requirements.txt 才能开启此项

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        # 设置环境变量，强制 Nuitka 自动完成依赖工具（如 Dependency Walker）的下载
        env:
          NUITKA_AUTO_DOWNLOAD: "yes"
        run: |
          python -m nuitka --standalone --onefile --enable-plugin=tk-inter --windows-icon-from-ico=icon.ico --windows-console-mode=disable GUI.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQ_Tool_Artifact
          path: GUI.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          tag_name: ${{ github.ref_name || 'manual-build' }}
          body: |
            ## Release Notes / 更新说明
            ${{ github.event.inputs.release_notes || 'Automated build from repository push.' }}
            
            ---
            *Built by GitHub Actions*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}