name: 一键构建并发布 EXE

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: '发布标题'
        required: true
        default: '正式版发布'
      release_body:
        description: '更新说明'
        required: false
        default: '1. 修复了已知问题\n2. 提升了稳定性'
      is_prerelease:
        description: '是否为预发布版本'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装基础依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Nuitka 自动打包
        # 移除了重命名，保留了图标路径，增加了 uiautomation 收集
        run: |
          python -m nuitka --standalone `
                           --onefile `
                           --enable-plugin=tk-inter `
                           --windows-icon-from-ico=icon.ico `
                           --windows-console-mode=disable `
                           --collect-all=uiautomation `
                           GUI.py

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 直接发布 GUI.exe，不进行重命名
          files: GUI.exe
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: ${{ github.event.inputs.release_body || '通过推送标签自动构建发布' }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}