name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的标签触发（如 v1.0.0）
  workflow_dispatch: # 支持手动触发并填入发布说明
    inputs:
      release_notes:
        description: 'Enter the release description / 输入发布说明'
        required: false
        default: |
          - Thread-safe UTC logging.
          - System tray support.
          - Dynamic status updates.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 需要根目录有 requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        # --accept-downloads: 自动同意下载 Dependency Walker 等必要工具
        # --windows-console-mode=disable: 禁用控制台窗口
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-icon-from-ico=icon.ico `
            --windows-console-mode=disable `
            --accept-downloads `
            GUI.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQ_Tool_Build
          path: GUI.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          tag_name: ${{ github.ref_name || 'manual-build' }}
          body: |
            ## Release Notes / 更新说明
            ${{ github.event.inputs.release_notes || 'Automated build from tag push.' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}