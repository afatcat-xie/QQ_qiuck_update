name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Enter the release description / 输入发布说明'
        required: false
        default: |
          - Thread-safe UTC logging.
          - System tray support.
          - Dynamic status updates.

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install zstandard

      - name: Check Python Syntax
        run: |
          python -m py_compile GUI.py
          Write-Host "Python syntax check passed ✓"

      - name: Clean Build Cache
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force build }
          if (Test-Path ".nuitka") { Remove-Item -Recurse -Force .nuitka }
          Write-Host "Build cache cleaned ✓"

      - name: Build EXE with Nuitka
        run: |
          $iconArg = if (Test-Path "icon.ico") { "--windows-icon-from-ico=icon.ico" } else { "" }
          Write-Host "Building with Nuitka..."
          echo yes | python -m nuitka `
            --onefile `
            --windows-console-mode=disable `
            --standalone `
            --enable-plugin=tk-inter `
            --include-package=PIL `
            --include-package=keyboard `
            --include-package=pystray `
            --include-package=psutil `
            --include-package=uiautomation `
            --include-package=comtypes `
            
            $iconArg `
            --nofollow-import-to="*test*" `
            --output-dir=dist `
            GUI.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka build failed" }
          Write-Host "Build completed successfully ✓"

      - name: Verify Build Output
        run: |
          if (Test-Path "dist\GUI.exe") {
            $fileSize = (Get-Item "dist\GUI.exe").Length / 1MB
            Write-Host "EXE generated successfully: $($fileSize)MB"
          } else {
            throw "GUI.exe not found in dist folder"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQ_Tool_Build
          path: dist/GUI.exe
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GUI.exe
          tag_name: ${{ github.ref_name || format('build-{0}', github.run_number) }}
          draft: false
          prerelease: false
          body: |
            ## Release Notes / 更新说明
            ${{ github.event.inputs.release_notes || 'Automated build from tag push.' }}
            
            ### Build Information
            - Build Date: ${{ github.event.repository.updated_at }}
            - Commit: ${{ github.sha }}
            - Python: 3.10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
