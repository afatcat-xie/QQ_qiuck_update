name: Build and Release EXE

on:
  push:
    tags:
      - 'v*' # 当推送 v 开头的标签时自动触发
  workflow_dispatch:
    inputs:
      tag_name:
        description: '请输入发布的版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: windows-latest
    
    # 核心修复：赋予创建 Release 的权限
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        # 1. echo yes | 自动处理 Nuitka 的下载确认询问
        # 2. 单行编写，彻底消除反引号 ` 导致的换行解析故障
        run: echo yes | python -m nuitka --standalone --onefile --enable-plugin=tk-inter --windows-icon-from-ico=icon.ico --windows-console-mode=disable GUI.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          # 逻辑：手动触发时使用输入的标签，推送 Tag 时使用 Git 标签名
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          body: |
            ## 构建成功
            - 触发方式: ${{ github.event_name }}
            - 构建文件: GUI.exe
            - 构建时间: ${{ github.event.head_commit.timestamp || 'Manual' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}