name: Build and Release EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Update Notes / 更新说明'
        required: false
        default: '- Thread-safe UTC logging\n- System tray support'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with Nuitka
        # 使用环境变量强制同意下载，避免 --accept-downloads 报错
        env:
          NUITKA_AUTO_DOWNLOAD: "yes"
        run: |
          python -m nuitka `
            --standalone `
            --onefile `
            --enable-plugin=tk-inter `
            --windows-icon-from-ico=icon.ico `
            --windows-console-mode=disable `
            GUI.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QQ_Tool_Build
          path: GUI.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          tag_name: ${{ github.ref_name || 'manual-build' }}
          body: |
            ## Release Details
            ${{ github.event.inputs.release_notes || 'Automated build.' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}