name: 一键构建并发布 EXE

on:
  # 支持手动填表触发
  workflow_dispatch:
    inputs:
      tag_name:
        description: '版本号 (例如: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: '发布标题'
        required: true
        default: '正式版发布'
      release_body:
        description: '更新说明 (支持 Markdown)'
        required: false
        default: '1. 修复了已知问题\n2. 提升了稳定性'
      is_prerelease:
        description: '是否为预发布版本 (true/false)'
        required: true
        type: boolean
        default: false

  # 支持推送标签触发
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    
    # 核心权限：确保能写 Release
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Nuitka 自动打包
        # 1. echo yes | 解决自动下载确认
        # 2. 单行命令避免换行解析错误
        run: echo yes | python -m nuitka --standalone --onefile --enable-plugin=tk-inter --windows-icon-from-ico=icon.ico --windows-console-mode=disable GUI.py

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: GUI.exe
          # 优先级：网页输入 > 自动标签名
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: ${{ github.event.inputs.release_body || '通过推送标签自动构建发布' }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}